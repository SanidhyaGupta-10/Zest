version: '3.8'

services:
  # Backend Express Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zest-server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      - PORT=4000
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend Next.js Web App
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: zest-web
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    environment:
      - PORT=3000
    depends_on:
      server:
        condition: service_healthy
    restart: always
